<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalgudi's Wedding Invitation</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Background music -->
  <audio id="bg-music" src="assets/music.mp3" autoplay loop></audio>

  <header>
    <h1 class="kannada">💍 ಕಲ್ಗುಡಿ ವಿವಾಹ ಆಹ್ವಾನ 💍</h1>
    <h2>Kalgudi's Wedding Invitation</h2>
  </header>

  <!-- Couples -->
  <section class="couples">
    <div class="couple">
      <img src="assets/mahesh-shilpa.jpg" alt="Mahesh & Shilpa" />
      <h3>Mahesh Kalgudi & Shilpa Hosalli</h3>
    </div>
    <div class="couple">
      <img src="assets/sachin-chaitra.jpg" alt="Sachin & Chaitra" />
      <h3>Sachin Kalgudi & Chaitra</h3>
    </div>
  </section>

  <!-- Events -->
  <section class="events">
    <h2>💫 Wedding Events 💫</h2>
    <ul>
      <li>💍 Engagement – 25th October 2025, 7:30 PM</li>
      <li>👰🤵 Wedding – 26th October 2025</li>
    </ul>
    <p>📍 Venue: Hulkoti  
      <a href="https://maps.app.goo.gl/U6zntFHLTP5La5Hz7" target="_blank">View on Google Maps</a>
    </p>
  </section>

  <!-- Countdown -->
  <section class="countdown">
    <h2>⏳ Countdown to Wedding ⏳</h2>
    <div id="timer"></div>
  </section>

  <!-- Fireworks and petals -->
  <canvas id="fireworks"></canvas>
  <div id="petals"></div>
</body>
</html>
